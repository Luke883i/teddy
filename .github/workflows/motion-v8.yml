name: motion-v8
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
concurrency:
  group: teddy-motion-v8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  motion:
    name: motion / 1m-scenarios-1m-mutations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
      - name: install and check syntax
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check web/teddy/motion-contract.js
          node --check web/teddy/motion-engine.js
          node --check web/teddy/choreography-v12.js
          node --check web/teddy/expressive-v14.js
          node --check web/teddy/implicit-skin-v16.js
          node --check web/teddy/underarm-relief-v19.js
          node --check tools/mutate-underarm-v19.mjs
          node --check web/teddy/implicit-runtime-v16.js
          node --check web/teddy/skin-quality-v18.js
          node --check web/teddy/skin-seam-v20.js
          node --check web/teddy/plush-islands-v21.js
          node --check tools/mutate-plush-v21.mjs
          node --check tools/mutate-shoulder-v20.mjs
          node --check tools/browser-visual-v18.mjs
          node --check web/teddy/facial-contract-v17.js
          node --check web/teddy/facial-runtime-v17.js
          node --check tools/browser-face-v17.mjs
          node --check web/teddy/motion-dynamics-v15.js
          node --check web/teddy/silhouette-v15.js
          node --check web/teddy/motion-falsifiers-v15.js
          node --check web/teddy/init-v13.js
          node --check web/teddy/canvas-motion-v13.js
          node --check web/teddy/motion-panel-v12.js
          node --check web/teddy/fur-material-v12.js
          node --check web/teddy/render.js
          node --check web/teddy/cinematic-v11.js
          node --check web/app.js
          node --check web/teddy/movement-v8.js
          node --check web/teddy/motion-wire-v8.js
          node --check web/teddy/world-v8.js
          node --check web/local.js
      - name: test 32 character dynamics and moving-joint silhouette
        run: node --test tests/motion-silhouette-v15.test.mjs
      - name: verify V17 facial topology, anatomy, 32-motif micro-expression and both backends
        run: node --test tests/facial-v17.test.mjs
      - name: mutate one million facial speech and behavior states
        run: node tools/mutate-face-v17.mjs
      - name: prove V18 anatomical weights, deformation diagnostics, framing, and material safety
        run: node --test tests/visual-hardening-v18.test.mjs
      - name: mutate 1 million adversarial anatomical influence pairs
        run: node tools/mutate-anatomy-v18.mjs
      - name: V21 prove real Teddy three independent watertight anatomical islands
        run: node --test tests/plush-v21.test.mjs
      - name: V21 score 1000 morphology candidates and execute 10 million realistic mutations
        run: node tools/mutate-plush-v21.mjs
      - name: V20 test real Teddy animated shoulder collar, edge strain and accordion falsifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node --test tests/skin-seam-v20.test.mjs > "$RUNNER_TEMP/teddy-v20-forensics.log" 2>&1; then
            tail -n 28 "$RUNNER_TEMP/teddy-v20-forensics.log"
          else
            tail -n 120 "$RUNNER_TEMP/teddy-v20-forensics.log"
            if test "${{ github.event_name }}" = "pull_request"; then
              { echo '### V20 exact geometrical falsifier'; echo; echo '~~~'; tail -n 100 "$RUNNER_TEMP/teddy-v20-forensics.log"; echo; echo '~~~'; } > "$RUNNER_TEMP/teddy-v20-forensics.md"
              gh issue comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/teddy-v20-forensics.md" || true
            fi
            exit 1
          fi
      - name: V20 mutate one million continuous shoulder-collar parameters
        run: node tools/mutate-shoulder-v20.mjs
      - name: V19 prove real bilateral underarm negative-space and full-body watertight skin
        run: node --test tests/underarm-relief-v19.test.mjs
      - name: V19 falsify one million underarm field mutants and twelve real Teddy meshes
        run: node tools/mutate-underarm-v19.mjs
      - name: prove watertight unified Teddy mesh and animated GPU binding
        run: node --test tests/implicit-skin-v16.test.mjs
      - name: test expressive 32-profile movement and reset
        run: node --test tests/expressive-v14.test.mjs
      - name: test Canvas2D project and paint
        run: node --test --test-name-pattern="Canvas2D uses same" tests/visible-motion-v13.test.mjs
      - name: test every named routine changes geometry
        run: node --test --test-name-pattern="every Base and Complex" tests/visible-motion-v13.test.mjs
      - name: test interrupt and replay from new UI click
        run: node --test --test-name-pattern="new UI click" tests/visible-motion-v13.test.mjs
      - name: test CSP safe boot gate
        run: node --test --test-name-pattern="CSP allows sole" tests/visible-motion-v13.test.mjs
      - name: test inherited UI renderer integration
        run: node --test tests/motion-ui-v12.test.mjs
      - name: test choreography contracts
        run: node --test tests/choreography-v12.test.mjs
      - name: test inherited motion contracts
        run: node --test tests/motion-contract-v8.test.mjs tests/motion-world-v8.test.mjs tests/motion-routing-v8.test.mjs
      - name: prove text HTTP server starts
        run: node tools/browser-text-v17.mjs --probe-server
      - name: prove Chrome CDP starts
        run: node tools/browser-text-v17.mjs --probe-chrome
      - name: prove DOM shell loads
        run: node tools/browser-text-v17.mjs --probe-dom
      - name: prove language UI boots in Chrome
        run: |
          set -o pipefail
          node tools/browser-text-v17.mjs --probe-bootstrap 2>&1 | tee "$RUNNER_TEMP/teddy-browser-diag.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: teddy-chrome-language-diagnostics
          path: ${{ runner.temp }}/teddy-browser-diag.log
          if-no-files-found: ignore
      - name: report forensic gate result to PR
        if: ${{ failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -f "$RUNNER_TEMP/teddy-browser-diag.log"; then
            { echo '### Chrome language bootstrap diagnostic'; echo; echo '~~~'; tail -c 5200 "$RUNNER_TEMP/teddy-browser-diag.log"; echo; echo '~~~'; } > "$RUNNER_TEMP/teddy-pr-diagnostic.md"
            gh issue comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/teddy-pr-diagnostic.md"
          fi
      - name: prove text reply and SQLite via Chrome
        run: node tools/browser-text-v17.mjs --probe-chat
      - name: prove real text chat, SQLite and closeable UI in Chrome
        run: node tools/browser-text-v17.mjs
      - name: diagnose real UI mounting with facial installer
        run: node tools/browser-motion-smoke-v13.mjs --probe-ui
      - name: diagnose baseline greeting motion under Canvas2D
        run: node tools/browser-motion-smoke-v13.mjs --probe-greet
      - name: prove motion through real browser pixels under production CSP
        run: node tools/browser-motion-smoke-v13.mjs
      - name: falsify 50m local-intermediate-global motion mutations
        run: node tools/mutate-motion-v15.mjs
      - name: mutate 1 million SDF skin and topology candidates
        run: node tools/mutate-implicit-v16.mjs
      - name: require actual WebGL2 SwiftShader capability in headless Chrome
        run: |
          set -euo pipefail
          passed=0
          for attempt in 1 2 3; do
            echo "WebGL2 mandatory capability attempt $attempt/3"
            if node tools/browser-implicit-smoke-v16.mjs --probe-capability; then passed=1; break; fi
            sleep 4
          done
          test "$passed" -eq 1
      - name: prove fused skin initialization and watertight topology in real Chrome
        run: node tools/browser-implicit-smoke-v16.mjs --probe-activation
      - name: prove real WebGL2 welded skin under production CSP
        run: node tools/browser-implicit-smoke-v16.mjs
      - name: capture three actual WebGL2 compositor views and verify visible quality state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          logfile="$RUNNER_TEMP/teddy-v21-visual-forensics.log"
          if node tools/browser-visual-v18.mjs > "$logfile" 2>&1; then
            tail -n 30 "$logfile"
          else
            tail -n 110 "$logfile"
            if test "${{ github.event_name }}" = "pull_request"; then
              { echo '### V21 browser visual regression failure'; echo; echo '~~~'; tail -n 100 "$logfile"; echo; echo '~~~'; } > "$RUNNER_TEMP/teddy-v21-forensics.md"
              gh issue comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/teddy-v21-forensics.md" || true
            fi
            exit 1
          fi
      - name: upload V18 visual regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teddy-v18-visual-snapshots
          path: artifacts/visual-v18/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: prove expressive face in real WebGL2 Chrome under production CSP
        run: node tools/browser-face-v17.mjs
      - name: mutate 100 million semantic kinematic parameters
        run: node tools/mutate-expressive-v14.mjs
      - name: saturate 1m movement scenarios
        run: node tools/simulate-motion-v8.mjs --full
      - name: kill 1m motion mutations
        run: node tools/mutate-motion-v8.mjs --full
      - name: verify converged evidence
        run: |
          node -e "const r=require('./docs/motion-v8-report.json');if(r.identity.scenarios!==1000000||r.unsafe!==0||r.runtime.unsafe!==0||r.runtime.frames<1000000||r.invariants.length<18)process.exit(1)"
          node -e "const r=require('./docs/motion-v8-mutation-report.json');if(r.identity.mutations!==1000000||r.identity.critical!==1000000||r.killed!==1000000||r.survivors!==0||r.unsafeBase!==0)process.exit(1)"
          git diff --exit-code -- docs/motion-v8-report.json docs/motion-v8-mutation-report.json
