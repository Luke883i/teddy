name: cognitive-reasoning-v32
on:
  pull_request:
    paths:
      - 'server/lib/grounded-reasoner-v32.mjs'
      - 'server/lib/semantic-spine.mjs'
      - 'tests/grounded-reasoner-v32.test.mjs'
      - 'tools/prove-hundred-sessions-v32.mjs'
      - 'tools/prove-real-text-v20.mjs'
      - 'tools/report-v32-readback.mjs'
      - '.github/workflows/cognitive-reasoning-v32.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  microkernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: verify semantic source syntax
        run: node --check server/lib/grounded-reasoner-v32.mjs && node --check server/lib/semantic-spine.mjs && node --check tools/prove-hundred-sessions-v32.mjs
      - name: 10000 inference and arithmetic contracts plus previous cognitive regressions
        run: node --test tests/grounded-reasoner-v32.test.mjs tests/cognitive-workspace-v31.test.mjs tests/semantic-spine-v24.test.mjs
      - name: inherited 10000 workspace mutations
        run: node tools/mutate-cognition-v31.mjs
  real-hundred:
    needs: microkernel
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TEDDY_V32_REAL_100: '1'
      TEDDY_V32_SKIP_BROWSER_30: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: install dependencies
        run: npm ci --ignore-scripts
      - name: actual pinned Qwen GGUF plus 100 distinct genuine HTTP conversations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/prove-real-text-v20.mjs
      - name: fail closed unless 100 real sessions and 140 model generations were committed
        run: |
          test -s "$RUNNER_TEMP/teddy-v32-real-100/readback-100.json"
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/teddy-v32-real-100/readback-100.json"));if(p.realModel!==true||p.realHttp!==true||p.actualSessions!==100||p.uniqueConversationIds!==100||p.genuineInitialGenerations!==100||p.additionalContextModelGenerations!==40||p.records.length!==100)process.exit(1)'
          node -e 'const fs=require("fs"),p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/teddy-real-text-v20-proof.json"));if(p.hundredSessionSummary?.actualSessions!==100||p.hundredSessionSummary.modelGenerations!==140)process.exit(1)'
      - name: publish bounded semantic readback as PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/report-v32-readback.mjs > "$RUNNER_TEMP/teddy-v32-readback.md"
          gh issue comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/teddy-v32-readback.md" || true
      - name: expose bounded failure diagnosis in artifact label
        if: always()
        id: forensic
        run: |
          node -e 'const fs=require("fs"),p=process.env.RUNNER_TEMP+"/teddy-v32-real-100/",f=fs.existsSync(p+"readback-100.json")?p+"readback-100.json":p+"readback-100-partial.json";let r={complete:0,failures:["missing-report"]};try{r=JSON.parse(fs.readFileSync(f))}catch{}const n=r.actualSessions??r.complete??0;const raw=String((r.failures||[])[0]||"ok").split("\n")[0];const slug=("n"+n+"-"+raw).toLowerCase().replace(/[^a-z0-9-]/g,"-").slice(0,90);fs.appendFileSync(process.env.GITHUB_OUTPUT,"slug="+slug+"\n")'
      - name: archive dialogue outcomes and failure partials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teddy-v32-real-100-dialogue-readback-${{ steps.forensic.outputs.slug }}
          path: ${{ runner.temp }}/teddy-v32-real-100/
          if-no-files-found: ignore
          retention-days: 14
      - name: archive model manifest without model weights
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teddy-v32-real-100-model-receipt
          path: ${{ runner.temp }}/teddy-real-text-v20-proof.json
          if-no-files-found: ignore
          retention-days: 14
