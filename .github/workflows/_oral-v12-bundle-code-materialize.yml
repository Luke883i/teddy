name: oral-v12-bundle-code-materialize
on:
  push:
    branches: [agent/oral-pipe-v1-test]
permissions:
  contents: write
concurrency:
  group: oral-v12-bundle-code-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/oral-pipe-v1-test
      - name: materialize and verify oral v12 code proof bundle
        shell: bash
        run: |
          set -euo pipefail
          cat tools/_oral-v12-bundle.b64.1 tools/_oral-v12-bundle.b64.2 tools/_oral-v12-bundle.b64.3 | base64 -d > "$RUNNER_TEMP/oral-v12.tgz"
          test "$(sha256sum "$RUNNER_TEMP/oral-v12.tgz" | cut -d' ' -f1)" = 23cf690e04b2561f547ac647a1166e1b35e4fa264d9a9705f6af816d99c19d32
          tar -xzf "$RUNNER_TEMP/oral-v12.tgz"
          rm -f .github/workflows/oral-v12.yml
          test "$(git hash-object server/lib/runtime-platform.mjs)" = ffe62d619149d3fb60c1c6dfb9b2d58c3d01bc6b
          test "$(git hash-object server/lib/runtime-installation.mjs)" = cdac5ef35e3f5771a73b661ccb02de59997e1297
          test "$(git hash-object tests/oral-pipe-runtime-v12.test.mjs)" = 34ed8dbb200e878aa5d4f93cbf04e93b35e74f62
          test "$(git hash-object tools/oral-pipe-mutation-v12.mjs)" = 3266aa7b1f3ccd20156213e0d943c68f2206d507
          test "$(git hash-object tools/oral-pipe-stress-v12.mjs)" = a1615b7ea8b54a203b4d88e19cb0045492284028
          test "$(git hash-object docs/oral-pipe-v12-hardening.md)" = 56deaf9143121b962c506798f6583fbe996f4c1c
          test "$(git hash-object artifacts/oral-pipe-mutation-v12.json)" = 768cdd856c6592ead9809ae3536d1f86540309e5
          test "$(git hash-object artifacts/oral-pipe-stress-v12.json)" = 3b2f74f530a550aa52dbcb567fbd9530e170da48
          git rm tools/_oral-v12-bundle.b64.1 tools/_oral-v12-bundle.b64.2 tools/_oral-v12-bundle.b64.3 .github/workflows/_oral-v12-bundle-code-materialize.yml .github/workflows/_oral-v12-bundle-materialize.yml
          git add server/lib/runtime-platform.mjs server/lib/runtime-installation.mjs tests/oral-pipe-runtime-v12.test.mjs tools/oral-pipe-mutation-v12.mjs tools/oral-pipe-stress-v12.mjs docs/oral-pipe-v12-hardening.md artifacts/oral-pipe-mutation-v12.json artifacts/oral-pipe-stress-v12.json
          git config user.name "teddy-runtime-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(runtime): materialize verified oral v12 code proof bundle"
          git push origin HEAD:agent/oral-pipe-v1-test
