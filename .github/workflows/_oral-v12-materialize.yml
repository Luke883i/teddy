name: oral-v12-materialize
on:
  push:
    branches: [agent/oral-pipe-v1-test]
permissions:
  contents: write
concurrency:
  group: oral-v12-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/oral-pipe-v1-test
      - name: materialize verified manager blob
        shell: bash
        run: |
          set -euo pipefail
          git apply tools/_materialize-runtime-manager-v12.patch
          test "$(git hash-object server/lib/runtime-manager.mjs)" = "44888896316bed643d0adf52ce3444db4fb0447d"
          git rm tools/_materialize-runtime-manager-v12.patch .github/workflows/_oral-v12-materialize.yml
          git add server/lib/runtime-manager.mjs
          git config user.name "teddy-runtime-materializer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(runtime): materialize verified oral v12 manager blob"
          git push origin HEAD:agent/oral-pipe-v1-test
