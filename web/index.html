<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0c10"><title>Teddy</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/world-v8.css"></head><body>
<main id="app">
  <canvas id="scene" aria-label="Teddy, orsetto interattivo"></canvas>
  <header><strong>teddy</strong><span id="health" class="dot">offline</span><button id="settingsBtn" class="icon" aria-label="Impostazioni">⚙</button></header>
  <section id="statusPanel" class="status"><span id="stateText">inizializzazione</span><div id="meter"><i></i></div></section>
  <section id="connectionNotice" class="connection-notice hidden" role="status" aria-live="polite"><strong id="connectionTitle"></strong><p id="connectionBody"></p><div class="notice-actions"><button id="connectionDiagnostics">Diagnostica</button><button id="connectionPrimary" class="primary">Riprova</button></div></section>
  <nav><button data-view="talk" class="active">Parla</button><button data-view="history">Cronologia</button><button data-view="memory">Memoria</button><button data-view="studio">Studio</button><button data-view="diagnostics">Diagnostica</button></nav>
  <section id="drawer" class="drawer hidden"></section>
  <section id="onboarding" class="modal hidden"><div class="card"><h1>OpenAI opzionale</h1><p>Teddy parte in modalità locale senza account. Inserisci una OpenAI API key soltanto se avvii esplicitamente <code>TEDDY_PROVIDER=openai</code>. La key rimane cifrata sul server locale e non viene restituita al browser.</p><input id="apiKey" type="password" autocomplete="off" placeholder="sk-…"><div class="actions"><button id="saveKey">Salva</button></div><small id="keyError"></small></div></section>
  <button id="talkBtn" class="talk">Parla con Teddy</button>
  <audio id="remoteAudio" autoplay></audio>
</main><script type="module">import {installCinematicV11} from '/teddy/cinematic-v11.js';import {installTeddyRefinement} from '/teddy/refinement-v7.js';import {installMovementEngine} from '/teddy/movement-v8.js';import {installMotionTelemetryBridge} from '/teddy/motion-wire-v8.js';import {installWorldScene} from '/teddy/world-v8.js';installCinematicV11();installTeddyRefinement();installMovementEngine();installMotionTelemetryBridge();installWorldScene();</script><script type="module" src="/app.js"></script></body></html>
